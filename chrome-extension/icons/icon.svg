<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d9ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Mask body -->
  <ellipse cx="64" cy="72" rx="46" ry="30" fill="url(#maskGrad)"/>

  <!-- Left eye hole -->
  <ellipse cx="44" cy="68" rx="13" ry="9" fill="#4f46e5"/>
  <!-- Left eye shine -->
  <ellipse cx="40" cy="65" rx="4" ry="3" fill="white" opacity="0.35"/>

  <!-- Right eye hole -->
  <ellipse cx="84" cy="68" rx="13" ry="9" fill="#4f46e5"/>
  <!-- Right eye shine -->
  <ellipse cx="80" cy="65" rx="4" ry="3" fill="white" opacity="0.35"/>

  <!-- Handle / stick at bottom -->
  <rect x="59" y="98" width="10" height="20" rx="5" fill="white" opacity="0.75"/>

  <!-- Decorative dots top (representing "IA" sparkles) -->
  <circle cx="32" cy="30" r="4" fill="white" opacity="0.6"/>
  <circle cx="64" cy="22" r="6" fill="white" opacity="0.85"/>
  <circle cx="96" cy="30" r="4" fill="white" opacity="0.6"/>
</svg>
