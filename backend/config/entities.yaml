entities:
  AU_ABN:
    description: Australian Business Number
    enabled: false
    mask: '[ABN]'
  AU_ACN:
    description: Australian Company Number
    enabled: false
    mask: '[ACN]'
  AU_MEDICARE:
    description: Australian Medicare Number
    enabled: false
    mask: '[MEDICARE_AU]'
  AU_TFN:
    description: Australian Tax File Number
    enabled: false
    mask: '[TFN]'
  CREDIT_CARD:
    description: Numéro de carte bancaire
    enabled: true
    mask: '[CARTE]'
  CRYPTO:
    description: Adresse de cryptomonnaie (Bitcoin, Ethereum)
    enabled: false
    mask: '[CRYPTO]'
  DATE_TIME:
    description: Date ou date et heure
    enabled: true
    mask: '[DATE]'
    context:
    - date
    - né
    - née
    - naissance
    - rendez-vous
    patterns:
    - name: DATE_FR_LONG
      regex: \b\d{1,2}(er)?\s+(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}\b
      score: 0.8
    - name: DATE_FR_NUMERIC
      regex: \b\d{1,2}[/.-]\d{1,2}[/.-]\d{4}\b
      score: 0.6
  EMAIL_ADDRESS:
    description: Adresse e-mail
    enabled: true
    mask: '[EMAIL]'
  FR_PLATE:
    description: Plaque d’immatriculation française (format AA-123-AA)
    enabled: true
    mask: '[PLAQUE]'
    context:
    - immatriculation
    - plaque
    - voiture
    - véhicule
    patterns:
    - name: PLATE_DASHES
      regex: \b[A-Z]{2}-\d{3}-[A-Z]{2}\b
      score: 0.7
    - name: PLATE_SPACES
      regex: \b[A-Z]{2} \d{3} [A-Z]{2}\b
      score: 0.6
  FR_SECU:
    description: Numéro de sécurité sociale français (NIR, 15 chiffres)
    enabled: true
    mask: '[SECU]'
    validator: nir
    context:
    - sécurité sociale
    - sécu
    - nir
    - immatriculé
    - assuré
    patterns:
    - name: NIR_SPACED
      regex: \b[12]\s\d{2}\s\d{2}\s\d{2}\s\d{3}\s\d{3}\s\d{2}\b
      score: 0.7
    - name: NIR_PLAIN
      regex: \b[12]\d{14}\b
      score: 0.5
  FR_SIREN:
    description: Numéro SIREN français (9 chiffres, entreprises)
    enabled: true
    mask: '[SIREN]'
    validator: luhn
    context:
    - siren
    - siret
    - entreprise
    - société
    patterns:
    - name: SIREN_SPACED
      regex: \b\d{3} \d{3} \d{3}\b
      score: 0.5
    - name: SIREN_PLAIN
      regex: \b\d{9}\b
      score: 0.4
  FR_SIRET:
    description: Numéro SIRET français (14 chiffres, établissements)
    enabled: true
    mask: '[SIRET]'
    validator: luhn
    context:
    - siret
    - siren
    - entreprise
    - établissement
    patterns:
    - name: SIRET_SPACED
      regex: \b\d{3} \d{3} \d{3} \d{5}\b
      score: 0.6
    - name: SIRET_PLAIN
      regex: \b\d{14}\b
      score: 0.4
  IBAN_CODE:
    description: Numéro de compte bancaire IBAN
    enabled: true
    mask: '[IBAN]'
  IP_ADDRESS:
    description: Adresse IP
    enabled: true
    mask: '[IP]'
  LOCATION:
    description: Lieu géographique
    enabled: true
    mask: '[LIEU]'
  MEDICAL_LICENSE:
    description: Numéro de licence médicale
    enabled: false
    mask: '[LICENCE_MEDICALE]'
  NRP:
    description: National Registry of Persons (UK)
    enabled: false
    mask: '[NRP]'
  PERSON:
    description: Nom et prénom d’une personne
    enabled: true
    mask: '[PERSONNE]'
  PHONE_NUMBER:
    description: Numéro de téléphone
    enabled: true
    mask: '[TELEPHONE]'
  PL_ID_CARD:
    description: Numéro de carte d’identité polonaise
    enabled: true
    mask: '[CARTE_IDENTITE_PL]'
    patterns:
    - name: ID_CARD_NEW
      regex: \b[A-Z]{3}\d{6}\b
      score: 0.7
  PL_NIP:
    description: Numéro d’identification fiscale polonais (NIP)
    enabled: true
    mask: '[NIP]'
    validator: nip
    patterns:
    - name: NIP_PATTERN_WITH_DASHES
      regex: \b\d{3}-\d{3}-\d{2}-\d{2}\b|\b\d{3}-\d{2}-\d{2}-\d{3}\b
      score: 0.8
    - name: NIP_PATTERN_NO_DASHES
      regex: \b\d{10}\b
      score: 0.5
  PL_PASSPORT:
    description: Numéro de passeport polonais
    enabled: true
    mask: '[PASSEPORT_PL]'
    patterns:
    - name: PASSPORT_NEW
      regex: \b[A-Z]{2}\d{7}\b
      score: 0.7
    - name: PASSPORT_OLD
      regex: \b[A-Z]{3}\d{6}\b
      score: 0.6
  PL_PESEL:
    description: Numéro PESEL polonais
    enabled: true
    mask: '[PESEL]'
    patterns:
    - name: PESEL_PATTERN
      regex: \b\d{11}\b
      score: 0.6
  PL_REGON:
    description: Numéro REGON polonais (identification des entreprises)
    enabled: true
    mask: '[REGON]'
    validator: regon
    patterns:
    - name: REGON_9
      regex: \b\d{9}\b
      score: 0.4
    - name: REGON_14
      regex: \b\d{14}\b
      score: 0.5
  SG_NRIC_FIN:
    description: Singapore National Registration ID
    enabled: false
    mask: '[NRIC_SG]'
  UK_NHS:
    description: Numéro NHS (National Health Service du Royaume-Uni)
    enabled: false
    mask: '[NHS]'
  URL:
    description: Adresse URL
    enabled: true
    mask: '[URL]'
  US_BANK_NUMBER:
    description: Numéro de compte bancaire américain
    enabled: false
    mask: '[BANK_US]'
  US_DRIVER_LICENSE:
    description: Numéro de permis de conduire américain
    enabled: false
    mask: '[PERMIS_CONDUIRE_US]'
  US_ITIN:
    description: Individual Taxpayer Identification Number USA
    enabled: false
    mask: '[ITIN]'
  US_PASSPORT:
    description: Numéro de passeport américain
    enabled: false
    mask: '[PASSEPORT_US]'
  US_SSN:
    description: Numéro de sécurité sociale américain (SSN)
    enabled: false
    mask: '[SSN]'
language: fr
threshold: 0.35
