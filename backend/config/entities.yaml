entities:
  AU_ABN:
    description: Australian Business Number
    enabled: false
    mask: '[ABN]'
  AU_ACN:
    description: Australian Company Number
    enabled: false
    mask: '[ACN]'
  AU_MEDICARE:
    description: Australian Medicare Number
    enabled: false
    mask: '[MEDICARE_AU]'
  AU_TFN:
    description: Australian Tax File Number
    enabled: false
    mask: '[TFN]'
  CARD_SECURITY:
    description: Cryptogramme (CVV) et date d’expiration d’une carte bancaire
    enabled: true
    mask: '[CARTE_SECURITE]'
    context:
    - cvv
    - cvc
    - cryptogramme
    - exp
    - expiration
    - expire
    patterns:
    - name: CVV_LABELLED
      regex: '(?<=CVV )\d{3,4}\b|(?<=CVC )\d{3,4}\b|(?<=CVV: )\d{3,4}\b|(?<=CVV : )\d{3,4}\b'
      score: 0.8
    - name: CARD_EXPIRY
      regex: \b(?:0[1-9]|1[0-2])/\d{2}\b(?!/)
      score: 0.1
  CH_AVS:
    description: Numéro AVS suisse (assurance sociale, 756.XXXX.XXXX.XX)
    enabled: true
    mask: '[AVS]'
    context:
    - avs
    - ahv
    - assurance
    patterns:
    - name: AVS
      regex: \b756[.\s]?\d{4}[.\s]?\d{4}[.\s]?\d{2}\b
      score: 0.85
  CREDENTIALS:
    description: Identifiant de connexion et mot de passe (commandes, journaux)
    enabled: true
    mask: '[IDENTIFIANTS_CONNEXION]'
    patterns:
    - name: CURL_USER
      regex: (?<=-u )\S+|(?<=--user )\S+
      score: 0.8
    - name: JSON_LOGIN_FIELD
      regex: '(?<="user": ")[^"\n]+|(?<="username": ")[^"\n]+|(?<="login": ")[^"\n]+|(?<="password": ")[^"\n]+|(?<="pwd": ")[^"\n]+'
      score: 0.7
    - name: PASSWORD_LABELLED
      regex: '(?<=mot de passe : )\S+|(?<=password: )\S+|(?<=mdp : )\S+'
      score: 0.7
  CREDIT_CARD:
    description: Numéro de carte bancaire
    enabled: true
    mask: '[CARTE]'
  CRYPTO:
    description: Adresse de cryptomonnaie (Bitcoin, Ethereum)
    enabled: false
    mask: '[CRYPTO]'
  DATE_TIME:
    description: Date ou date et heure
    enabled: true
    mask: '[DATE]'
    context:
    - date
    - né
    - née
    - naissance
    - rendez-vous
    patterns:
    - name: DATE_FR_LONG
      regex: \b\d{1,2}(er)?\s+(janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+\d{4}\b
      score: 0.8
    - name: DATE_FR_NUMERIC
      regex: \b\d{1,2}[/.-]\d{1,2}[/.-]\d{4}\b
      score: 0.6
  EMAIL_ADDRESS:
    description: Adresse e-mail
    enabled: true
    mask: '[EMAIL]'
    patterns:
    - name: EMAIL_OBFUSCATED
      regex: '[\w.+-]+\s*[\[(]\s*(?:at|arobase)\s*[\])]\s*[\w-]+(?:\s*[\[(]\s*(?:dot|point)\s*[\])]\s*[\w-]+)+'
      score: 0.8
  FR_PASSPORT:
    description: Numéro de passeport français (2 chiffres, 2 lettres, 5 chiffres)
    enabled: true
    mask: '[PASSEPORT]'
    context:
    - passeport
    - passport
    patterns:
    - name: PASSPORT_FR
      regex: \b\d{2}(?-i:[A-Z]{2})\d{5}\b
      score: 0.5
  FR_PLATE:
    description: Plaque d’immatriculation (France AA-123-AA, Suisse GE 123 456)
    enabled: true
    mask: '[PLAQUE]'
    context:
    - immatriculation
    - plaque
    - voiture
    - véhicule
    patterns:
    - name: PLATE_DASHES
      regex: \b[A-Z]{2}-\d{3}-[A-Z]{2}\b
      score: 0.7
    - name: PLATE_SPACES
      regex: \b[A-Z]{2} \d{3} [A-Z]{2}\b
      score: 0.6
    - name: PLATE_CH
      regex: \b(?-i:AG|AI|AR|BE|BL|BS|FR|GE|GL|GR|JU|LU|NE|NW|OW|SG|SH|SO|SZ|TG|TI|UR|VD|VS|ZG|ZH)[ -]?\d{1,3}[ ']?\d{3}\b
      score: 0.3
  FR_ADRESSE:
    description: Adresse postale française (numéro + type de voie, code postal et ville optionnels)
    enabled: true
    mask: '[ADRESSE]'
    context:
    - adresse
    - domicile
    - habite
    - demeurant
    - domicilié
    patterns:
    - name: ADRESSE_VOIE
      regex: \b\d{1,4}(?:\s?(?:bis|ter|quater))?,?\s+(?:rue|avenue|av\.|boulevard|bd|place|allée|impasse|chemin|route|quai|cours|square|passage|faubourg|rond-point|résidence|lotissement)(?:\s+(?:(?:de|du|des|la|le|les)\s+)?(?:[dl]['’])?(?-i:[A-ZÀ-Ý][\wÀ-ÿ'’\-]*)){1,4}(?:,?\s+\d{5}(?:\s+(?-i:[A-ZÀ-Ý][\wÀ-ÿ\-]*)(?:\s+(?:cedex|\d{1,2}))?)?)?
      score: 0.75
    - name: ADRESSE_VOIE_NUMERO_APRES
      regex: \b(?:rue|avenue|av\.|boulevard|bd|place|allée|impasse|chemin|route|quai|cours|square|passage|faubourg|rond-point|résidence|lotissement)(?:\s+(?:(?:de|du|des|la|le|les)\s+)?(?:[dl]['’])?(?-i:[A-ZÀ-Ý][\wÀ-ÿ'’\-]*)){1,4}\s+\d{1,4}(?:\s?(?:bis|ter|[a-z])\b)?(?:,\s*(?:app?t\.?|appartement)\s*\w+)?(?:,\s*\d{4,5}\s+(?-i:[A-ZÀ-Ý][\wÀ-ÿ\-]*))?
      score: 0.75
    - name: ADRESSE_COMPLEMENT
      regex: \b(?:lot|îlot|app?t\.?|appartement|bâtiment|bât\.)\s*(?-i:[A-Z]?\d+[A-Z]?)\b
      score: 0.5
  FR_CODE_POSTAL:
    description: Code postal français (5 chiffres)
    enabled: true
    mask: '[CODE_POSTAL]'
    context:
    - postal
    - cp
    - cedex
    - adresse
    - ville
    patterns:
    - name: CODE_POSTAL
      regex: \b(?:0[1-9]|[1-8]\d|9[0-8])\d{3}\b
      score: 0.3
    - name: CODE_POSTAL_VILLE
      regex: \b(?:0[1-9]|[1-8]\d|9[0-8])\d{3}(?=\s+(?-i:[A-ZÀ-Ý][a-zà-ÿ]))
      score: 0.6
  FR_SECU:
    description: Numéro de sécurité sociale français (NIR, 15 chiffres)
    enabled: true
    mask: '[SECU]'
    validator: nir
    strict_validation: false
    context:
    - sécurité sociale
    - sécu
    - nir
    - immatriculé
    - assuré
    patterns:
    - name: NIR
      regex: \b[12]\s?\d{2}\s?(?:0[1-9]|1[0-2]|[2-9]\d)\s?(?:\d{2}|2[AB])\s?\d{3}\s?\d{3}\s?\d{2}\b
      score: 0.5
  FR_SIREN:
    description: Numéro SIREN français (9 chiffres, entreprises)
    enabled: true
    mask: '[SIREN]'
    validator: luhn
    strict_validation: false
    context:
    - siren
    - siret
    - entreprise
    - société
    patterns:
    - name: SIREN_SPACED
      regex: \b\d{3} \d{3} \d{3}\b
      score: 0.5
    - name: SIREN_PLAIN
      regex: \b\d{9}\b
      score: 0.3
  FR_SIRET:
    description: Numéro SIRET français (14 chiffres, établissements)
    enabled: true
    mask: '[SIRET]'
    validator: luhn
    strict_validation: false
    context:
    - siret
    - siren
    - entreprise
    - établissement
    patterns:
    - name: SIRET_SPACED
      regex: \b\d{3} \d{3} \d{3} \d{5}\b
      score: 0.6
    - name: SIRET_PLAIN
      regex: \b\d{14}\b
      score: 0.3
  IBAN_CODE:
    description: Numéro de compte bancaire IBAN
    enabled: true
    mask: '[IBAN]'
  GPS_COORDINATES:
    description: Coordonnées GPS (latitude, longitude)
    enabled: true
    mask: '[GPS]'
    patterns:
    - name: LAT_LON
      regex: (?<![\d.])-?\d{1,2}\.\d{3,},\s?-?\d{1,3}\.\d{3,}\b
      score: 0.6
  IP_ADDRESS:
    description: Adresse IP
    enabled: true
    mask: '[IP]'
  MAC_ADDRESS:
    description: Adresse MAC d’un appareil
    enabled: true
    mask: '[MAC]'
    patterns:
    - name: MAC
      regex: \b[0-9A-F]{2}(?:[:-][0-9A-F]{2}){5}\b
      score: 0.8
  REFERENCE_ID:
    description: Référence interne (matricule, n° client, dossier, pièce d’identité)
    enabled: true
    mask: '[IDENTIFIANT]'
    context:
    - matricule
    - client
    - dossier
    - cni
    - identité
    - identifiant
    - patient
    - contrat
    patterns:
    - name: REF_HYPHENATED
      regex: \b(?-i:[A-Z]{2,5})(?:-(?-i:[A-Z0-9]{2,6}))*-\d{3,}\b
      score: 0.5
    - name: REF_LETTERS_DIGITS
      regex: \b(?-i:[A-Z]{1,3})\d{6,12}\b
      score: 0.2
  SECRET_TOKEN:
    description: Jeton de session ou d’API (JWT, clés)
    enabled: true
    mask: '[JETON]'
    patterns:
    - name: JWT
      regex: \beyJ[\w-]+\.[\w-]+\.[\w-]+
      score: 0.9
  LOCATION:
    description: Lieu géographique
    enabled: true
    mask: '[LIEU]'
  MEDICAL_LICENSE:
    description: Numéro de licence médicale
    enabled: false
    mask: '[LICENCE_MEDICALE]'
  NRP:
    description: National Registry of Persons (UK)
    enabled: false
    mask: '[NRP]'
  ORGANIZATION:
    description: Organisation, entreprise ou employeur
    enabled: true
    mask: '[ORGANISATION]'
  PERSON:
    description: Nom et prénom d’une personne
    enabled: true
    mask: '[PERSONNE]'
  PHONE_NUMBER:
    description: Numéro de téléphone
    enabled: true
    mask: '[TELEPHONE]'
    patterns:
    - name: PHONE_FR
      regex: (?<![\d.])(?:(?:\+|00)\s?33\s?(?:\(0\)\s?)?[1-9]|0[1-9])(?:[\s.-]?\d{2}){4}(?![\d.]*\d)
      score: 0.7
    - name: PHONE_INTL
      regex: (?<![\w+])(?:\+|00)[1-9]\d{0,2}(?:[\s.-]?\(?\d{1,4}\)?){2,6}(?!\d)
      score: 0.75
  PL_ID_CARD:
    description: Numéro de carte d’identité polonaise
    enabled: true
    mask: '[CARTE_IDENTITE_PL]'
    patterns:
    - name: ID_CARD_NEW
      regex: \b[A-Z]{3}\d{6}\b
      score: 0.7
  PL_NIP:
    description: Numéro d’identification fiscale polonais (NIP)
    enabled: true
    mask: '[NIP]'
    validator: nip
    patterns:
    - name: NIP_PATTERN_WITH_DASHES
      regex: \b\d{3}-\d{3}-\d{2}-\d{2}\b|\b\d{3}-\d{2}-\d{2}-\d{3}\b
      score: 0.8
    - name: NIP_PATTERN_NO_DASHES
      regex: \b\d{10}\b
      score: 0.5
  PL_PASSPORT:
    description: Numéro de passeport polonais
    enabled: true
    mask: '[PASSEPORT_PL]'
    patterns:
    - name: PASSPORT_NEW
      regex: \b[A-Z]{2}\d{7}\b
      score: 0.7
    - name: PASSPORT_OLD
      regex: \b[A-Z]{3}\d{6}\b
      score: 0.6
  PL_PESEL:
    description: Numéro PESEL polonais
    enabled: true
    mask: '[PESEL]'
    patterns:
    - name: PESEL_PATTERN
      regex: \b\d{11}\b
      score: 0.6
  PL_REGON:
    description: Numéro REGON polonais (identification des entreprises)
    enabled: true
    mask: '[REGON]'
    validator: regon
    patterns:
    - name: REGON_9
      regex: \b\d{9}\b
      score: 0.4
    - name: REGON_14
      regex: \b\d{14}\b
      score: 0.5
  SG_NRIC_FIN:
    description: Singapore National Registration ID
    enabled: false
    mask: '[NRIC_SG]'
  UK_NHS:
    description: Numéro NHS (National Health Service du Royaume-Uni)
    enabled: false
    mask: '[NHS]'
  URL:
    description: Adresse URL
    enabled: true
    mask: '[URL]'
  US_BANK_NUMBER:
    description: Numéro de compte bancaire américain
    enabled: false
    mask: '[BANK_US]'
  US_DRIVER_LICENSE:
    description: Numéro de permis de conduire américain
    enabled: false
    mask: '[PERMIS_CONDUIRE_US]'
  US_ITIN:
    description: Individual Taxpayer Identification Number USA
    enabled: false
    mask: '[ITIN]'
  US_PASSPORT:
    description: Numéro de passeport américain
    enabled: false
    mask: '[PASSEPORT_US]'
  US_SSN:
    description: Numéro de sécurité sociale américain (SSN)
    enabled: false
    mask: '[SSN]'
language: fr
threshold: 0.35
